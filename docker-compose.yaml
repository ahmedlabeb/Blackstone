version: "3.9"

services:
  # ----------------------------------------
  rabbitmq:
    image: rabbitmq:3.13-management
    ports: [ "5673:5672", "15672:15672" ]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      retries: 5

  # ----------------------------------------
  mysql-account:
    image: mysql:8.3
    container_name: mysql-account
    ports: [ "3307:3306" ]
    environment:
      MYSQL_DATABASE: account_schema
      MYSQL_ROOT_PASSWORD: rootroot
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      retries: 5

  # ----------------------------------------
  account-service:
    build:
      context: ./services/account-service
      dockerfile: Dockerfile
    depends_on:
      rabbitmq: { condition: service_healthy }
      mysql-account: { condition: service_healthy }
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-account:3306/account_schema?allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rootroot
      SPRING_RABBITMQ_HOST: rabbitmq
    ports: [ "8282:8282" ]
    volumes:
      - ./services/account-service/src/main/resources/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  # ========================================
  #  ➜  NEW: Customer‑Service container
  # ========================================
  mysql-customer:
    image: mysql:8.3
    container_name: mysql-customer
    ports: [ "3308:3306" ]
    environment:
      MYSQL_DATABASE: customer_schema
      MYSQL_ROOT_PASSWORD: rootroot
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      retries: 5

  customer-service:
    build:
      context: ./services/customer-service
      dockerfile: Dockerfile
    depends_on:
      rabbitmq: { condition: service_healthy }
      mysql-customer: { condition: service_healthy }
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-customer:3306/customer_schema?allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rootroot
      SPRING_RABBITMQ_HOST: rabbitmq
    ports: [ "8181:8080" ]
    volumes:
      - ./services/customer-service/src/main/resources/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

networks:
  default:
    name: ms‑network
