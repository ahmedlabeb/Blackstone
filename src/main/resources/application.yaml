
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/account_schema?useSSL=false&serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: rootroot
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  rabbitmq:
    queue: account-service-queue
    exchange: customer-events
    routing:
      created: customer.created
      updated: customer.updated
      deleted: customer.deleted
    host: localhost
    port: 5672
    username: guest
    password: guest
server:
  port: 8282