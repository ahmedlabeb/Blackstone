spring:
  datasource:
    url: jdbc:mysql://localhost:3306/customer_schema?useSSL=false&serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: rootroot
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  rabbitmq:
    queue: customer-service-queue
    exchange: account-events
    routing:
      created: account.created
      updated: account.updated
      deleted: account.deleted
    host: localhost
    port: 5672
    username: guest
    password: guest
server:
  port: 8080
services:
  account:
    base-url: http://localhost:8282